server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    # A minimal liveness response for the host monitor. It discloses no build or host metadata.
    location = /healthz {
        default_type text/plain;
        access_log off;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    # This status document contains only allowlisted operational status, no secrets or school data.
    location = /termly-health-status.json {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location = /termly-runtime-config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|woff2|png|jpg|jpeg|webp|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public" always;
        try_files $uri =404;
    }
}
